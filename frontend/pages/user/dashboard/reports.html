<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{if(localStorage.getItem("tunton_side")==="min")document.documentElement.classList.add("side-min")}catch(e){}</script>
  <title>All reports | TunTon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="icon" type="image/png" href="/frontend/assets/logo/tunton-paw.png">
  <link rel="stylesheet" href="user.css">
</head>
<body>
<div class="dash">
  <div id="app-nav"></div>

  <div class="dash-main">
    <main>
      <section class="view" id="view-reports">
        <div class="view-head"><h1>All reports</h1><p>Every active lost and found report, without the map.</p></div>
        <div class="toolbar">
          <div class="chips" role="radiogroup" aria-label="Report type">
            <label><input type="radio" name="rk" value="all" checked><span>All</span></label>
            <label><input type="radio" name="rk" value="lost"><span>Lost</span></label>
            <label><input type="radio" name="rk" value="found"><span>Found</span></label>
          </div>
          <select id="rsp" class="btn btn-small btn-plain" style="padding:.4em .8em" aria-label="Species"><option value="">All species</option><option>Dog</option><option>Cat</option><option>Other</option></select>
          <input type="search" id="rq" class="rsearch" placeholder="Search color, breed, barangay&hellip;" aria-label="Search reports">
          <span class="chip" id="rcount"></span>
        </div>
        <div class="pet-list pet-list--grid" id="all-list"></div>
      </section>
    </main>
  </div>
</div>

<dialog id="detail-dialog" class="dialog detail" aria-labelledby="d-title">
  <button type="button" class="dialog-close" id="d-close" aria-label="Close">&times;</button>
  <div class="d-photo">
    <img id="d-img" alt="">
    <span class="tag-missing" id="d-tag"><span class="tag-dot" aria-hidden="true"></span><span id="d-tagtxt"></span></span>
  </div>
  <div class="d-thumbs" id="d-thumbs"></div>
  <div class="d-body">
    <h2 id="d-title"></h2>
    <dl class="d-list" id="d-list"></dl>
    <div class="d-actions">
      <button type="button" class="btn btn-sun" id="d-found">I found this pet</button>
      <button type="button" class="btn btn-small" id="d-map">View on map</button>
    </div>
  </div>
</dialog>

<script src="js/sidebar.js"></script>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
