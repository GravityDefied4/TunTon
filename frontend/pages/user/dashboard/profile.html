<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{if(localStorage.getItem("tunton_side")==="min")document.documentElement.classList.add("side-min")}catch(e){}</script>
  <title>My profile | TunTon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/frontend/css/style.css">
  <link rel="icon" type="image/png" href="/frontend/assets/logo/tunton-paw.png">
  <link rel="stylesheet" href="user.css">
</head>
<body>
<div class="dash">
  <div id="app-nav"></div>

  <div class="dash-main">
    <main>
      <section class="view" id="view-profile">
        <div class="view-head"><h1>My profile</h1><p>Your details and the reports you have filed.</p></div>
        <div class="box pf-head">
          <div class="pf-avatar" id="pf-avatar"></div>
          <div><h2 id="pf-name-big"></h2><p id="pf-email"></p><p class="hint" id="pf-since"></p></div>
        </div>
        <div class="pf-stats">
          <div class="box"><b id="st-lost">0</b><span>Lost reports</span></div>
          <div class="box"><b id="st-found">0</b><span>Found reports</span></div>
          <div class="box"><b id="st-home">0</b><span>Reunited</span></div>
        </div>
        <div class="box">
          <h2>My details</h2>
          <form class="form" id="profile-form" novalidate>
            <div><label for="pf-dname">Display name</label><input type="text" id="pf-dname" name="dname" maxlength="40"></div>
            <div><label for="pf-phone">Phone number</label><input type="text" id="pf-phone" name="phone" inputmode="tel" maxlength="20" placeholder="09XX XXX XXXX"></div>
            <div><label for="pf-brgy">Home barangay</label><select id="pf-brgy" name="brgy"><option value="">Select&hellip;</option></select></div>
            <p class="hint full">Your phone number and barangay are used to pre-fill your reports. Your email comes from your Google account.</p>
            <p class="form-note full" id="pf-note" role="status"></p>
            <div class="full"><button type="submit" class="btn btn-sun">Save changes</button></div>
          </form>
        </div>
        <div class="box">
          <h2>My reports</h2>
          <ul class="rep-list" id="rep-list"></ul>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="js/sidebar.js"></script>
<script src="js/common.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
